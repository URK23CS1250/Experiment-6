<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Calculator</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .calculator {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 360px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    label {
      display: block;
      margin-top: 12px;
      color: #444;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      background-color: #007bff;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .result {
      margin-top: 15px;
      background: #f1f1f1;
      padding: 10px;
      border-radius: 8px;
    }

    .result p {
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h2>💰 Budget Calculator</h2>
    
    <label>Total Amount (₹):</label>
    <input type="number" id="amount" placeholder="Enter total amount">

    <label>Room Rent (%):</label>
    <input type="number" id="rent" placeholder="Enter % for rent">

    <label>Accessories (%):</label>
    <input type="number" id="accessories" placeholder="Enter % for accessories">

    <label>Emergency (%):</label>
    <input type="number" id="emergency" placeholder="Enter % for emergency">

    <label>Savings (%):</label>
    <input type="number" id="saving" placeholder="Enter % for savings">

    <button id="evaluate">Evaluate My Money</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    $(document).ready(function(){
      $("#evaluate").click(function(){
        let amount = parseFloat($("#amount").val());
        let rent = parseFloat($("#rent").val());
        let accessories = parseFloat($("#accessories").val());
        let emergency = parseFloat($("#emergency").val());
        let saving = parseFloat($("#saving").val());

        if(isNaN(amount) || isNaN(rent) || isNaN(accessories) || isNaN(emergency) || isNaN(saving)){
          alert("Please fill all fields correctly!");
          return;
        }

        let totalPercent = rent + accessories + emergency + saving;

        if(totalPercent !== 100){
          alert("The total percentage must be 100%");
          return;
        }

        let rentValue = (amount * rent / 100).toFixed(2);
        let accessoriesValue = (amount * accessories / 100).toFixed(2);
        let emergencyValue = (amount * emergency / 100).toFixed(2);
        let savingValue = (amount * saving / 100).toFixed(2);

        $("#result").html(`
          <p>🏠 Room Rent: ₹${rentValue}</p>
          <p>👜 Accessories: ₹${accessoriesValue}</p>
          <p>🚑 Emergency: ₹${emergencyValue}</p>
          <p>💵 Savings: ₹${savingValue}</p>
        `);
      });
    });
  </script>
</body>
</html>
